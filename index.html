<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product API - Fetch Method Task</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="max-w-3xl mx-auto p-6 space-y-6">
      <h1 class="text-3xl font-bold">Products Data</h1>

      <section class="border border-gray-300 p-5 rounded-xl">
        <h2 class="font-semibold text-xl mb-3">
          map() - Product Names & Prices
        </h2>
        <div id="product-prices" class="leading-14"></div>
      </section>

      <section class="border border-gray-300 p-5 rounded-xl">
        <h2 class="font-semibold text-xl mb-3">
          filter() - Products Above $100
        </h2>
        <div id="filtered-products" class="leading-10"></div>
      </section>

      <section class="border border-gray-300 p-5 rounded-xl">
        <h2 class="font-semibold text-xl mb-3">find() - Find Product by ID</h2>
        <div id="search-product" class="leading-10"></div>
      </section>

      <section class="border border-gray-300 p-5 rounded-xl">
        <h2 class="font-semibold text-xl mb-3">
          forEach() - All Product Titles
        </h2>
        <div id="product-titles" class="leading-10"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
